<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Preview — Live Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0e17;
    --bg-panel: #111827;
    --bg-editor: #0d1117;
    --bg-preview: #161b22;
    --border: #21262d;
    --border-accent: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-glow: rgba(88, 166, 255, 0.15);
    --green: #3fb950;
    --purple: #bc8cff;
    --orange: #f0883e;
    --radius: 12px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ═══ Header ═══ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--bg-panel), #1a1f2e);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    box-shadow: 0 2px 12px rgba(88, 166, 255, 0.3);
  }

  .header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .header h1 span {
    color: var(--text-muted);
    font-weight: 400;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-editor);
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .btn-accent {
    background: linear-gradient(135deg, var(--accent), #4493f0);
    border-color: transparent;
    color: #fff;
  }

  .btn-accent:hover {
    box-shadow: 0 2px 16px rgba(88, 166, 255, 0.4);
    transform: translateY(-1px);
  }

  /* ═══ Main Split ═══ */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .pane-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .pane-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pane-title .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .pane-title .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .pane-title .dot-blue { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .pane-stats {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    opacity: 0.7;
  }

  .divider {
    width: 3px;
    background: var(--border);
    cursor: col-resize;
    position: relative;
    flex-shrink: 0;
    transition: background var(--transition);
  }

  .divider:hover, .divider.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 40px;
    cursor: col-resize;
  }

  /* ═══ Editor ═══ */
  #editor {
    flex: 1;
    width: 100%;
    background: var(--bg-editor);
    color: var(--text);
    border: none;
    outline: none;
    padding: 20px;
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: 13px;
    line-height: 1.7;
    resize: none;
    tab-size: 2;
    overflow-y: auto;
  }

  #editor::placeholder {
    color: var(--text-muted);
    opacity: 0.5;
  }

  #editor::-webkit-scrollbar, #preview::-webkit-scrollbar {
    width: 6px;
  }
  #editor::-webkit-scrollbar-track, #preview::-webkit-scrollbar-track {
    background: transparent;
  }
  #editor::-webkit-scrollbar-thumb, #preview::-webkit-scrollbar-thumb {
    background: var(--border-accent);
    border-radius: 3px;
  }
  #editor::-webkit-scrollbar-thumb:hover, #preview::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }

  /* ═══ Preview ═══ */
  #preview {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    background: var(--bg-preview);
    font-size: 15px;
    line-height: 1.7;
  }

  /* ── Preview typography ── */
  #preview h1 { font-size: 28px; font-weight: 700; margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: #fff; }
  #preview h2 { font-size: 22px; font-weight: 600; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); color: #fff; }
  #preview h3 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; color: #fff; }
  #preview h4, #preview h5, #preview h6 { font-size: 15px; font-weight: 600; margin: 12px 0 6px; color: var(--text); }

  #preview p { margin: 8px 0; }
  #preview a { color: var(--accent); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }

  #preview strong { font-weight: 600; color: #fff; }
  #preview em { font-style: italic; color: var(--purple); }
  #preview del { color: var(--text-muted); }
  #preview mark { background: rgba(240, 136, 62, 0.25); color: var(--orange); padding: 1px 4px; border-radius: 3px; }

  #preview code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    background: rgba(110, 118, 129, 0.15);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--orange);
  }

  #preview pre {
    background: var(--bg-editor);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin: 12px 0;
  }

  #preview pre code {
    background: none;
    padding: 0;
    color: var(--text);
    font-size: 13px;
  }

  #preview blockquote {
    border-left: 3px solid var(--accent);
    margin: 12px 0;
    padding: 8px 16px;
    background: var(--accent-glow);
    border-radius: 0 6px 6px 0;
    color: var(--text-muted);
  }

  #preview ul, #preview ol {
    margin: 8px 0;
    padding-left: 24px;
  }

  #preview li { margin: 4px 0; }

  #preview hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  #preview img {
    max-width: 100%;
    border-radius: 8px;
    margin: 8px 0;
  }

  /* ── Preview tables (GFM pipe + raw HTML) ── */
  #preview table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 13px;
    background: var(--bg-editor);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  #preview thead {
    background: linear-gradient(135deg, rgba(88, 166, 255, 0.12), rgba(188, 140, 255, 0.08));
  }

  #preview th {
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 2px solid var(--border);
    border-right: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #preview th:last-child { border-right: none; }

  #preview td {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }

  #preview td:last-child { border-right: none; }

  #preview tbody tr:last-child td { border-bottom: none; }

  #preview tbody tr:hover {
    background: rgba(88, 166, 255, 0.05);
  }

  /* Nested table styling */
  #preview td table {
    margin: 4px 0;
    border: 1px solid var(--border-accent);
    border-radius: 6px;
    background: rgba(22, 27, 34, 0.6);
  }

  #preview td table th {
    font-size: 11px;
    padding: 6px 10px;
    background: rgba(88, 166, 255, 0.08);
  }

  #preview td table td {
    padding: 4px 10px;
    font-size: 12px;
  }

  /* ═══ Footer status bar ═══ */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 16px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
  }

  .footer-left, .footer-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    display: inline-block;
    margin-right: 4px;
  }

  /* ═══ Responsive ═══ */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .divider { width: 100%; height: 3px; cursor: row-resize; }
    #preview { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">M↓</div>
    <h1>Markdown Preview <span>— Live Editor</span></h1>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="clearEditor()" title="Clear editor">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      Clear
    </button>
    <button class="btn" onclick="loadSample()" title="Load sample Markdown">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Sample
    </button>
    <button class="btn btn-accent" onclick="copyMarkdown()" title="Copy Markdown to clipboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy
    </button>
  </div>
</div>

<div class="main">
  <!-- Editor pane -->
  <div class="pane" id="editorPane">
    <div class="pane-header">
      <div class="pane-title"><span class="dot dot-green"></span> Editor — Raw Markdown</div>
      <div class="pane-stats" id="editorStats">0 lines · 0 chars</div>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Paste your Markdown here...&#10;&#10;Supports:&#10;  • Standard GFM (headings, lists, bold, italic, code)&#10;  • Pipe tables  | col | col |&#10;  • Embedded HTML tables  <table>...</table>&#10;  • <br> line breaks inside cells"></textarea>
  </div>

  <!-- Resizable divider -->
  <div class="divider" id="divider"></div>

  <!-- Preview pane -->
  <div class="pane" id="previewPane">
    <div class="pane-header">
      <div class="pane-title"><span class="dot dot-blue"></span> Preview</div>
      <div class="pane-stats" id="previewStats">0 elements</div>
    </div>
    <div id="preview"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-left">
    <span><span class="status-dot"></span> Live preview active</span>
    <span>GFM + HTML supported</span>
  </div>
  <div class="footer-right">
    <span id="footerStats">Ready</span>
  </div>
</div>

<script>
  // ═══ Marked.js config ═══
  marked.setOptions({
    gfm: true,
    breaks: true,
    sanitize: false,
  });

  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const editorStats = document.getElementById('editorStats');
  const previewStats = document.getElementById('previewStats');
  const footerStats = document.getElementById('footerStats');

  // ═══ Live preview ═══
  function updatePreview() {
    const md = editor.value;
    const start = performance.now();
    preview.innerHTML = marked.parse(md);
    const ms = (performance.now() - start).toFixed(1);

    // Stats
    const lines = md.split('\n').length;
    const chars = md.length;
    editorStats.textContent = `${lines} line${lines !== 1 ? 's' : ''} · ${chars.toLocaleString()} chars`;

    const elements = preview.querySelectorAll('*').length;
    previewStats.textContent = `${elements} element${elements !== 1 ? 's' : ''}`;

    const tables = preview.querySelectorAll('table').length;
    footerStats.textContent = `Rendered in ${ms}ms · ${tables} table${tables !== 1 ? 's' : ''}`;
  }

  editor.addEventListener('input', updatePreview);

  // ═══ Tab key support ═══
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      updatePreview();
    }
  });

  // ═══ Actions ═══
  function clearEditor() {
    editor.value = '';
    updatePreview();
    editor.focus();
  }

  function copyMarkdown() {
    navigator.clipboard.writeText(editor.value).then(() => {
      footerStats.textContent = '✓ Copied to clipboard!';
      setTimeout(() => updatePreview(), 2000);
    });
  }

  function loadSample() {
    editor.value = `# Markdown Preview Demo

## Standard GFM Table

| Product  | Category    | Price  |
| -------- | ----------- | ------ |
| Laptop   | Electronics | £999   |
| Desk     | Furniture   | £249   |
| Notebook | Stationery  | £3     |

## Table with Rowspan Expanded

| Department  | Employee | Role           |
| ----------- | -------- | -------------- |
| Engineering | Alice    | Backend Dev    |
| Engineering | Bob      | Frontend Dev   |
| Engineering | Carol    | DevOps         |
| Marketing   | Dave     | SEO Specialist |
| Marketing   | Eve      | **Content Writer** |

## Complex Table (colspan + rowspan)

| ANNUAL SUMMARY | | | | |
| -------------- | ------------------- | ---------- | ---------- | -------------- |
| Product Details | | Financial Perf. | | Status |
| Code | Name | Q1 Revenue | Q2 Revenue | Lifecycle |
| P-001 | Funeral Plan Gold | £420,000 | £380,000 | **Active** |
| P-002 | Funeral Plan Silver | £290,000 | £310,000 | **Active** |
| P-003 | Probate Service | £120,000 | £145,000 | *Under Review* |

## Nested Table (HTML — renders as table-in-table)

<table>
<thead>
<tr>
<th>Inner Table</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>
<table>
<thead><tr><th>A</th><th>B</th></tr></thead>
<tbody>
<tr><td>1</td><td>2</td></tr>
<tr><td>3</td><td>4</td></tr>
</tbody>
</table>
</td>
<td>This cell contains a <strong>nested table</strong> that renders correctly.</td>
</tr>
</tbody>
</table>

## Multi-Paragraph Cell (with line breaks)

| Feature | Description | Notes |
| ------- | ----------- | ----- |
| Engine  | Primary: Pandoc<br>Fallback: MarkItDown<br>Legacy: Docling | Configured per router |
| Output  | GitHub Flavoured Markdown (.md) | Stored in SharePoint |

---

## Text Formatting

**Bold text**, *italic text*, ***bold italic***, ~~strikethrough~~, \`inline code\`.

> This is a blockquote with some important information.

- Bullet list item 1
  - Nested item
  - Another nested
- Bullet list item 2

1. Numbered item
2. Another item
   1. Sub-item
`;
    updatePreview();
  }

  // ═══ Resizable divider ═══
  const divider = document.getElementById('divider');
  const editorPane = document.getElementById('editorPane');
  const previewPane = document.getElementById('previewPane');
  let isDragging = false;

  divider.addEventListener('mousedown', (e) => {
    isDragging = true;
    divider.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const container = document.querySelector('.main');
    const rect = container.getBoundingClientRect();
    const percentage = ((e.clientX - rect.left) / rect.width) * 100;
    const clamped = Math.max(20, Math.min(80, percentage));
    editorPane.style.flex = `0 0 ${clamped}%`;
    previewPane.style.flex = `0 0 ${100 - clamped}%`;
  });

  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      divider.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });

  // ═══ Initial load — show sample ═══
  loadSample();
</script>

</body>
</html>
